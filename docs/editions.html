<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>回声剧场 · 首屏选稿</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3efe4;color:#271e23;font:16px/1.6 "PingFang SC",sans-serif}main{max-width:1700px;margin:auto;padding:clamp(20px,4vw,64px)}header{display:flex;align-items:end;justify-content:space-between;border-bottom:1px solid #9f9183;gap:15px;padding-bottom:20px}h1,h2,p{margin:0}h1,h2{font-family:"Songti SC",serif}h1{font-size:clamp(26px,3vw,50px)}header p{font-size:14px}nav{display:flex;gap:4px}button{min-height:44px;padding:7px 15px;border:1px solid #93877b;border-radius:2px;background:transparent;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#32262a;color:#fff}section{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin-top:27px}article{min-width:0}article img{width:100%;height:auto;display:block;border:1px solid #a69d92}a{color:inherit;text-underline-offset:4px}article>div{margin-top:12px}article p{font-size:14px;margin-bottom:6px}article h2{font-size:22px}body.phone article img{max-width:300px;margin:auto}@media(max-width:720px){header{display:grid}section{grid-template-columns:1fr}article{padding-bottom:18px;border-bottom:1px solid #c9c0b4}}
</style></head><body><main><header><div><h1>月亮失物处 · 首屏选稿</h1><p>同一幕戏，三种开场方式。点开小样可试演。</p></div><nav aria-label="选择截图尺寸"><button data-size="1440" aria-pressed="true">桌面</button><button data-size="390" aria-pressed="false">手机</button></nav></header><section></section></main><script>
const names=['A · 幕绳','B · 戏票','C · 场灯'],captions=['站在台前，拉下右上方的幕绳，再从台侧进入七号包厢。','展开一张戏票，撕下副券开幕，再凭票根进入七号包厢。','俯看剧场座席，推亮场灯，再从楼座图进入七号包厢。'];
function show(size){document.body.classList.toggle('phone',size==='390');document.querySelectorAll('[data-size]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.size===size)));document.querySelector('section').innerHTML=['a','b','c'].map((v,i)=>'<article><a href="play.html?sample=1&amp;v='+v+'" aria-label="试演'+names[i]+'"><img src="captures/'+v+'-'+size+'.png" alt="'+names[i]+'首屏截图"></a><div><h2>'+names[i]+'</h2><p>'+captions[i]+'</p><a href="play.html?sample=1&amp;v='+v+'">试演这一版 ↗</a></div></article>').join('');}
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>show(b.dataset.size));show(matchMedia('(max-width:700px)').matches?'390':'1440');
</script></body></html>
